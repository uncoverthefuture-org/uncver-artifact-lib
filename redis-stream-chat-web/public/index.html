<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artifacts Stream</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <span class="logo-icon">📡</span>
          <h1>Artifacts Stream</h1>
        </div>
        <span class="subtitle">Redis Stream UI</span>
      </div>
      <div class="header-right">
        <div class="tabs">
          <button class="tab active" data-tab="chat" onclick="switchTab('chat')">Chat</button>
          <button class="tab" data-tab="stream" onclick="switchTab('stream')">Stream</button>
        </div>
        <div class="status" id="connectionStatus">
          <span class="status-dot offline"></span>
          <span class="status-text">Connecting...</span>
        </div>
        <button class="btn-settings" onclick="toggleSettings()">⚙️</button>
      </div>
    </header>

    <div class="settings-panel" id="settingsPanel" style="display: none;">
      <div class="settings-content">
        <h3>Connection Settings</h3>
        <div class="settings-row">
          <label>Session ID:</label>
          <input type="text" id="sessionId" value="default">
        </div>
        <div class="settings-row">
          <label>WebSocket URL:</label>
          <input type="text" id="wsUrl" value="ws://localhost:3000">
        </div>
        <div class="settings-row">
          <label>Stream:</label>
          <input type="text" id="streamName" value="uncver:ai:router" disabled>
        </div>
        <div class="settings-actions">
          <button class="btn btn-primary" onclick="reconnect()">Reconnect</button>
          <button class="btn btn-secondary" onclick="toggleSettings()">Close</button>
        </div>
      </div>
    </div>

    <main class="chat-container" id="chatContainer">
      <div class="welcome-message">
        <div class="welcome-icon">📡</div>
        <h2>Artifacts Stream</h2>
        <p>Redis stream interface — chat or watch messages flow in real time.</p>
      </div>
    </main>

    <div class="stream-container" id="streamContainer" style="display: none;">
      <div class="stream-header">
        <span class="stream-title">Live Stream — <code id="streamNameDisplay">uncver:ai:router</code></span>
        <span class="stream-count" id="streamCount">0 messages</span>
        <button class="btn btn-secondary btn-sm" onclick="clearStream()">Clear</button>
      </div>
      <div class="stream-log" id="streamLog"></div>
    </div>

    <div class="typing-indicator" id="typingIndicator" style="display: none;">
      <span class="typing-text">AI is thinking</span>
      <span class="typing-dots"><span></span><span></span><span></span></span>
    </div>

    <footer class="input-area" id="chatInput">
      <div class="input-container">
        <textarea id="messageInput" placeholder="Type your message..." rows="1" maxlength="2000"></textarea>
        <div class="input-actions">
          <span class="char-count" id="charCount">0/2000</span>
          <button class="btn-voice" id="voiceBtn" onclick="toggleVoice()" title="Voice input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>
          <button class="btn-send" id="sendBtn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
      </div>
    </footer>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="app.js"></script>
</body>
</html>
